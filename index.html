<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sass-Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Sass-Calculator</h1>
    </header>
    <main>
      <div class="outer-layer">
        <div class="display-screen">0</div>
        <div class="opeartor-row-data">
          <button>Clear</button>
          <button>AC</button>
          <button>%</button>
          <button class="special-keys">/</button>
        </div>
        <div class="first-row-data">
          <button>7</button>
          <button>8</button>
          <button>9</button>
          <button class="special-keys">x</button>
        </div>
        <div class="2nd-row-data">
          <button>4</button>
          <button>5</button>
          <button>6</button>
          <button class="special-keys">-</button>
        </div>

        <div class="3nd-row-data">
          <button>1</button>
          <button>2</button>
          <button>3</button>
          <button class="special-keys">+</button>
        </div>

        <div class="otherOps-row-data">
          <button>+/-</button>
          <button>0</button>
          <button>.</button>
          <button class="special-keys">=</button>
        </div>
      </div>
    </main>
  </body>
</html>
